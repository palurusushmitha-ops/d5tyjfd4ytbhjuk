<!DOCTYPE html>
<html>
    <head>
        <title><button click events</title>
    </head>
    <body>
        <h2>click any button below:</h2>
        <button id ="btn1">button1</button>
        <button id ="btn2">button></button>
        <button id ="btn3">button3</button>
        <div id="result" style="margin-top:20px; color:blue; font-weight:bold;"></div>
        <script>
            const resultDiv=document.getElementById("result")
            document.getElementById("btn1").addEventListener("click",function(){
                resultDiv.textContent="button 1 was clicked!";
            });
            document.getElementById("btn2").addEventListener("click",function(){
                resultDiv.textContent="button2 was clicked!";
            });
            document.getElementById("btn3").addEventListener("click",function(){
                resultDiv.textContent="button3 was clicked!";
            });
            </script>
    </body>
</html>
